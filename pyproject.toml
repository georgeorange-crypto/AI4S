[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-research-os"
version = "0.1.0"
description = "Offline-first reproducible research workflow core"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.162.4",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.16.0",
  "mypy==1.19.0",
  "pytest==9.0.3",
  "ruff==0.14.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[project.scripts]
ai4s = "ai4s.cli:main"

[tool.setuptools.packages.find]
include = ["ai4s*"]
